<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Подход</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17171b;background:#f2f2f7}*{box-sizing:border-box}body{margin:0;padding: max(24px,env(safe-area-inset-top)) 16px 160px;max-width:650px;margin:auto}h1{font-size:34px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0 0 10px}.muted{color:#72727a;font-size:14px;line-height:1.5}.card{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #00000003}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#e9e9ef;color:#007aff;cursor:pointer;min-height:44px}.primary{background:#007aff;color:white;width:100%;font-weight:600}select{width:100%;border:0;background:white;padding:14px;border-radius:12px;color:#17171b}input{width:100%;min-width:0;padding:11px 5px;border:1px solid #e4e4eb;border-radius:10px;background:#f8f8fa;text-align:center;font-size:17px;color:#17171b}.row{display:grid;grid-template-columns:25px 1fr 1fr 48px;align-items:center;gap:9px;margin:9px 0}.row.done input{background:#edf8ef}.tick{padding:0;font-size:21px}.done .tick{background:#34c759;color:white}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.settings label{font-size:12px;color:#72727a}.settings input{text-align:left;font-size:15px;margin-top:4px}.timer{position:fixed;bottom:0;left:0;right:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid #ddd;z-index:2;text-align:center}.clock{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{color:#19723b;font-size:13px;margin:10px 0}details summary{cursor:pointer;color:#007aff;padding:8px 0}a{color:#007aff}#notice{color:#a54e00} .small{font-size:12px}
</style></head><body><div class="muted">ДНЕВНИК ТРЕНИРОВОК</div><h1>Подход</h1><div id="notice" class="muted"></div><div class="card"><label class="muted">Начало восьминедельного цикла</label><input id="start" type="date"><p id="phase" class="muted"></p><select id="day"></select><p class="muted small">Черновой сокращённый план. Сведение ног оставлено предварительно. Вес EZ указывай вместе с грифом. Неизвестные веса заполни вручную.</p></div><main id="exercises"></main><button class="primary" id="finish">Завершить тренировку</button><details class="card"><summary>История и резервная копия</summary><div class="tools"><button id="export">Экспорт данных</button><button id="import">Импорт данных</button></div><input hidden id="file" type="file" accept="application/json"><div id="history"></div></details><div class="timer"><div class="muted" id="timerLabel">Отдых между подходами</div><div class="clock" id="clock">03:00</div><div class="tools" style="justify-content:center"><button id="restart">Заново · 3 мин</button><button id="skip">Пропустить</button></div></div><script>
const PLAN=[["Грудь и трицепс", [["Жим в хаммере", 1, 6, 10, 100], ["Жим в хаммере вверх", 1, 8, 12, null], ["Бабочка", 0, 10, 15, null], ["Французский жим EZ", 0, 8, 12, null], ["Разгибания на блоке", 0, 10, 15, null], ["Скручивания в тренажёре", 0, 10, 20, null]]], ["Спина и бицепс", [["Верхний блок широким хватом", 1, 8, 12, null], ["Горизонтальная тяга", 1, 8, 12, null], ["Верхний блок узким хватом", 1, 10, 15, null], ["Бицепс с EZ-грифом", 0, 8, 12, null], ["Бицепс на скамье Скотта", 0, 10, 15, null]]], ["Плечи и трицепс", [["Жим над головой в тренажёре", 1, 6, 10, null], ["Махи в тренажёре", 0, 10, 15, null], ["Обратная бабочка", 0, 12, 20, null], ["Разгибания сидя в тренажёре", 0, 10, 15, null]]], ["Ноги и бицепс", [["Жим ногами", 1, 8, 12, null], ["Сгибания ног", 0, 10, 15, null], ["Разгибания ног", 0, 10, 15, null], ["Икры стоя", 0, 10, 15, null], ["Икры сидя", 0, 12, 20, null], ["Бицепс в тренажёре", 0, 10, 15, null], ["Сведение ног", 0, 12, 20, null]]]], KEY='podhod-v1', $=id=>document.getElementById(id);
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let state={version:1,start:today(),day:0,history:[],drafts:{},config:{},timerEnd:null}, storageOK=true;
try{let raw=localStorage.getItem(KEY);if(raw){let v=JSON.parse(raw);if(v.version===1)state=v;}}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false;$('notice').textContent='Не удалось сохранить данные. Сделай экспорт перед закрытием.'}}
function phase(){let days=Math.floor((Date.UTC(...state.start.split('-').map((x,i)=>i===1?+x-1:+x)) - Date.UTC(...today().split('-').map((x,i)=>i===1?+x-1:+x)))/86400000)*-1;let week=Math.max(1,Math.floor(days/7)+1);let p=Math.min(3,Math.floor((week-1)/2));return {week,p,sets:[[2,3],[3,3],[3,4],[4,4]][p]}}
const exkey=(d,i)=>`${d}-${i}`;
function lastFor(d){return [...state.history].reverse().find(x=>x.day===d)}
function ensureDraft(){let d=state.day;if(state.drafts[d])return state.drafts[d];let ph=phase(),last=lastFor(d);let exercises=PLAN[d][1].map((ex,i)=>{let k=exkey(d,i),cfg=state.config[k]||{step:null};state.config[k]=cfg;let n=ph.sets[ex[1]],prev=last?.exercises[i],w=prev?.rows[0]?.w??ex[4]??'';let equal=prev&&prev.rows.every(r=>r.done&&Number(r.r)>=ex[3]&&r.w!==''&&Number(r.w)>0&&Number(r.w)===Number(prev.rows[0].w));let increase=!!(equal&&n<=prev.rows.length&&Number(cfg.step)>0);if(increase)w=Math.round((Number(w)+Number(cfg.step))*1000)/1000;return {rows:Array.from({length:n},()=>({w,r:'',done:false})),suggested:increase,added:!!prev&&n>prev.rows.length}});state.drafts[d]={date:today(),phase:ph.p,exercises};save();return state.drafts[d]}
function render(){let ph=phase();$('start').value=state.start;$('day').value=state.day;$('phase').textContent=`Неделя ${ph.week} · Изоляция: ${ph.sets[0]} · Основные: ${ph.sets[1]} подхода`+(ph.week>8?' · Цикл завершён: пока сохраняется этап 7–8.':'');let draft=ensureDraft(),last=lastFor(state.day);$('exercises').innerHTML=PLAN[state.day][1].map((ex,i)=>{let prev=last?.exercises[i];return `<section class="card"><h2>${ex[0]}</h2><div class="muted">${draft.exercises[i].rows.length} × ${ex[2]}–${ex[3]} · ${ex[1]?'Основное':'Изоляция'}</div><div class="muted small">Прошлый раз: ${prev?prev.rows.map(r=>`${r.w||'—'} кг × ${r.r||'—'}`).join(' / '):'нет записи'}</div>${draft.exercises[i].suggested?'<p class="hint">Предложена прибавка веса. Проверь фактическую нагрузку.</p>':''}${draft.exercises[i].added?'<p class="hint">Добавлен подход — прежний вес сохранён.</p>':''}<div class="row muted small"><span>№</span><span>Вес, кг</span><span>Повторы</span><span></span></div>${draft.exercises[i].rows.map((r,j)=>`<div class="row ${r.done?'done':''}"><span>${j+1}</span><input aria-label="Вес, ${ex[0]}, подход ${j+1}" inputmode="decimal" type="text" value="${r.w}" data-i="${i}" data-j="${j}" data-field="w"><input aria-label="Повторы, ${ex[0]}, подход ${j+1}" inputmode="numeric" type="text" value="${r.r}" data-i="${i}" data-j="${j}" data-field="r"><button class="tick" data-i="${i}" data-j="${j}" aria-label="Отметить подход">${r.done?'✓':'○'}</button></div>`).join('')}<details><summary class="small">Шаг прибавки веса</summary><div class="settings"><label>Прибавка, кг<input type="number" min="0" step="0.25" data-step="${i}" value="${state.config[exkey(state.day,i)].step??''}" placeholder="Укажи шаг"></label></div><div class="muted small">Укажи до завершения тренировки. Предложение рассчитывается при создании следующей записи.</div></details></section>`}).join('');$('history').textContent='';state.history.slice().reverse().slice(0,30).forEach(h=>{let p=document.createElement('p');p.className='muted';p.textContent=`${new Date(h.time).toLocaleDateString('ru')} · ${PLAN[h.day][0]} · ${h.exercises.reduce((a,e)=>a+e.rows.filter(r=>r.done).length,0)} подходов`;$('history').append(p)});if(!storageOK)$('notice').textContent='Локальное сохранение недоступно. Используй экспорт.'}
PLAN.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${p[0]}`;$('day').append(o)});
$('day').onchange=e=>{state.day=+e.target.value;save();render()};
$('start').onchange=e=>{if(!e.target.value)return;if(Object.keys(state.drafts).length&&!confirm('Изменение даты пересоздаст незавершённые тренировки. Продолжить?')){e.target.value=state.start;return}state.start=e.target.value;state.drafts={};save();render()};
$('exercises').oninput=e=>{let t=e.target;if(t.dataset.field){let v=t.value.replace(',','.');if(v!==''&&!/^\d*(\.\d*)?$/.test(v))return;let r=state.drafts[state.day].exercises[+t.dataset.i].rows[+t.dataset.j];r[t.dataset.field]=v;r.done=false;t.closest('.row').classList.remove('done');t.closest('.row').querySelector('button').textContent='○';save()}if(t.dataset.step!==undefined){state.config[exkey(state.day,+t.dataset.step)].step=t.value===''?null:Number(t.value);save()}};
let audio;function enableAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function ring(){try{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.value=.15;o.frequency.value=880;o.start();o.stop(audio.currentTime+.6)}catch(e){}}
function startTimer(){enableAudio();state.timerEnd=Date.now()+180000;save();tick()}
$('exercises').onclick=e=>{let b=e.target.closest('.tick');if(!b)return;let r=state.drafts[state.day].exercises[+b.dataset.i].rows[+b.dataset.j];if(!r.done&&(r.w===''||!Number.isFinite(Number(r.w))||Number(r.w)<0||!Number.isInteger(Number(r.r))||Number(r.r)<1)){alert('Укажи корректный вес и целое число повторений.');return}r.done=!r.done;save();if(r.done)startTimer();render()};
function tick(){if(!state.timerEnd){$('clock').textContent='03:00';return}let seconds=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));$('clock').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(!seconds){state.timerEnd=null;save();$('clock').textContent='00:00';$('timerLabel').textContent='Отдых завершён';ring()}else $('timerLabel').textContent='Отдых между подходами'}setInterval(tick,500);$('restart').onclick=startTimer;$('skip').onclick=()=>{state.timerEnd=null;save();$('timerLabel').textContent='Отдых пропущен';tick()};
$('finish').onclick=()=>{let d=state.drafts[state.day];let rows=d.exercises.flatMap(e=>e.rows);if(!rows.some(r=>r.done)){alert('Сначала отметь хотя бы один подход.');return}if(!confirm(rows.every(r=>r.done)?'Сохранить завершённую тренировку?':'Есть невыполненные подходы. Сохранить тренировку как есть?'))return;state.history.push(JSON.parse(JSON.stringify({day:state.day,time:new Date().toISOString(),phase:d.phase,exercises:d.exercises})));delete state.drafts[state.day];state.timerEnd=null;state.day=(state.day+1)%4;save();render();tick();window.scrollTo({top:0,behavior:'smooth'})};
$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download=`podhod-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(v.version!==1||!/^\d{4}-\d{2}-\d{2}$/.test(v.start)||!Number.isInteger(v.day)||v.day<0||v.day>3||!Array.isArray(v.history)||!v.drafts||!v.config)throw Error();for(let h of v.history){if(!Number.isInteger(h.day)||h.day<0||h.day>3||!Array.isArray(h.exercises))throw Error()}if(!confirm('Заменить все текущие данные резервной копией?'))return;state=v;save();location.reload()}catch(e){alert('Не удалось прочитать резервную копию.')}};
render();tick();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
